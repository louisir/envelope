server {
    listen 0.0.0.0:19444 ssl;
    server_name _;
    ssl_certificate /etc/envelope-ha/app-pki/app.crt;
    ssl_certificate_key /etc/envelope-ha/app-pki/app.key;
    ssl_client_certificate /etc/envelope-ha/app-pki/client-ca.crt;
    ssl_verify_client on;
    ssl_verify_depth 1;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 12m;
    location /internal/v2/ {
        proxy_connect_timeout 3s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
        proxy_next_upstream off;
        proxy_set_header X-Envelope-Peer $ssl_client_s_dn;
        proxy_pass http://127.0.0.1:19094;
    }
    location / { return 404; }
}
