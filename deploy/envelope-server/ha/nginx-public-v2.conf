# Include only inside the intended HTTPS server. Preserve other application locations.
location ^~ /v2/ {
    limit_req zone=envelope_v2_rate burst=60 nodelay;
    limit_req_status 429;
    limit_conn envelope_v2_connections 8;
    limit_conn_status 429;
    client_max_body_size 16m;
    client_body_timeout 15s;
    proxy_connect_timeout 3s;
    proxy_send_timeout 75s;
    proxy_read_timeout 75s;
    proxy_next_upstream off;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
    proxy_set_header Host $host;
    proxy_set_header X-Envelope-Peer "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_pass http://127.0.0.1:19093;
}
