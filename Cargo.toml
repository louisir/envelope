[workspace]
members = [
    "crates/envelope-core",
    "crates/envelope-ffi",
    "crates/envelope-stego",
    "crates/envelope-bundle",
    "crates/envelope-store",
    "crates/envelope-net",
    "crates/envelope-server-core",
    "apps/envelope-cli",
    "apps/envelope-server",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1.0.100"
axum = "0.8"
base64 = "0.22.1"
bip39 = "2.2.0"
chacha20poly1305 = "0.10.1"
clap = { version = "4.5.53", features = ["derive"] }
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
hex = "0.4.3"
hkdf = "0.12.4"
image = { version = "0.25.9", default-features = false, features = ["png"] }
iroh = "1.0.0-rc.0"
iroh-tickets = "1.0.0-rc.0"
rand_core = { version = "0.6.4", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "time", "macros", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.19.0", features = ["v4", "serde"] }
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
zip = { version = "6.0.0", default-features = false, features = ["aes-crypto", "deflate"] }
